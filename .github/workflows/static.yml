# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Assemble approved site files
        # Publish only the paths listed in .github/site-files.txt; fail if one is missing
        run: |
          set -euo pipefail
          mkdir _site
          while IFS= read -r entry || [ -n "$entry" ]; do
            case "$entry" in ''|'#'*) continue ;; esac
            if [ ! -e "$entry" ]; then echo "Approved path not found: $entry"; exit 1; fi
            cp -R --parents "$entry" _site/
          done < .github/site-files.txt
          # Never publish files removed for disclosure reasons, even after a rollback restores them
          blocked=$(find _site \( -name 'CLAUDE*' -o -path '_site/Archive*' -o -path '_site/Drafts*' -o -name 'AI_Portfolio_Advisor_*.pdf' -o -name '.env*' \) -print)
          if [ -n "$blocked" ]; then echo "Blocked files in publish set:"; echo "$blocked"; exit 1; fi
          echo "Files to publish:"
          find _site -type f | sort
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload only the assembled, approved site files
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
